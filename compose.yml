services:
  kat-bot:
    build: .
    container_name: kat-bot
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./gifs:/app/gifs
      - ./data:/app/data

    healthcheck:
      test: ["CMD-SHELL", "python -c \"import os; os.kill(1, 0)\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s